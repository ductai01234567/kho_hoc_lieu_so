<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lớp học trực tuyến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbfcff; --grid:#dfe8f5; --ink:#17325c; --muted:#5b6b86; --margin:#d64550;
  --mark:#ffe27a; --card:#ffffff; --line:#c9d6ea; --btn:#17325c; --btn-text:#fff;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#101a2e; --grid:#1a2742; --ink:#e8eefb; --muted:#9db0d1; --margin:#ff7b85;
  --mark:#6b5a12; --card:#16223a; --line:#2c3d62; --btn:#e8eefb; --btn-text:#101a2e;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px; line-height:1.65; min-height:100vh;
}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--margin);outline-offset:2px}
header{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:space-between;
  padding:18px clamp(16px,4vw,40px);background:var(--card);border-bottom:2px solid var(--ink);
}
.brand{font-weight:800;font-size:1.5rem;letter-spacing:-.01em;margin:0}
.brand input{font:inherit;font-weight:800;background:transparent;border:0;border-bottom:2px dashed var(--line);width:min(70vw,420px);padding:2px 0}
.mode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:var(--btn);color:var(--btn-text);border:2px solid var(--btn);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--ink)}
.btn.danger{background:transparent;color:var(--margin);border-color:var(--margin)}
.btn.small{padding:4px 10px;font-size:.85rem}
.btn:hover{filter:brightness(1.12)}
.layout{display:grid;grid-template-columns:290px 1fr;gap:0;max-width:1300px;margin:0 auto}
nav{padding:24px clamp(16px,3vw,28px);}
nav h2{font-size:1rem;margin:0 0 12px;color:var(--muted);font-weight:500}
.lessons{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:8px}
.lessons button{
  width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:8px;
  padding:10px 12px;cursor:pointer;font-weight:500;display:flex;gap:10px;align-items:baseline
}
.lessons button .n{color:var(--muted);font-weight:700;min-width:1.6em}
.lessons button[aria-current="true"]{border-color:var(--ink);background:var(--mark);box-shadow:4px 4px 0 var(--ink)}
main{
  padding:28px clamp(16px,4vw,44px) 60px;min-height:70vh;
  background:var(--card);border-left:3px solid var(--margin);border-right:1px solid var(--line);
}
main h1{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.2;margin:0 0 12px;letter-spacing:-.02em}
.desc{max-width:70ch;color:var(--ink);white-space:pre-wrap;margin:0 0 28px}
h3{margin:34px 0 12px;font-size:1.2rem}
.video{margin:0 0 20px;max-width:860px}
.frame{position:relative;aspect-ratio:16/9;background:#000;border-radius:8px;overflow:hidden;border:2px solid var(--ink)}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.row{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.gallery figure{margin:0;position:relative}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:2px solid var(--ink);cursor:zoom-in;display:block;background:var(--grid)}
.gallery .x{position:absolute;top:8px;right:8px}
.field{width:100%;max-width:70ch;background:var(--paper);border:2px solid var(--line);border-radius:8px;padding:10px 12px}
.title-field{font-size:1.6rem;font-weight:800;max-width:100%}
.adder{display:flex;gap:8px;flex-wrap:wrap;max-width:860px;margin:8px 0}
.adder .field{flex:1;min-width:220px}
.hint{color:var(--muted);font-size:.88rem;max-width:70ch;margin:6px 0 0}
.empty{color:var(--muted);border:2px dashed var(--line);border-radius:8px;padding:18px;max-width:70ch}
.teacher-only{display:none}
body.edit .teacher-only{display:block}
body.edit .teacher-only.inline{display:flex}
body:not(.edit) .view-only{display:block}
body.edit .view-only{display:none}
#lightbox{position:fixed;inset:0;background:rgba(5,10,25,.88);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;cursor:zoom-out}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:8px;display:none;z-index:60;max-width:90vw}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  main{border-left:0;border-top:3px solid var(--margin)}
  nav{padding-bottom:8px}
  .lessons{grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);overflow-x:auto;padding-bottom:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 class="brand" id="brand"></h1>
  <div class="mode">
    <button class="btn ghost" id="toggle" aria-pressed="false">Chế độ giáo viên</button>
    <span class="teacher-only inline" style="gap:8px">
      <button class="btn ghost small" id="export">Sao lưu</button>
      <button class="btn ghost small" id="import">Khôi phục</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </span>
  </div>
</header>

<div class="layout">
  <nav aria-label="Danh sách bài học">
    <h2>Bài học</h2>
    <ul class="lessons" id="list"></ul>
    <button class="btn teacher-only" id="addLesson">+ Thêm bài học</button>
  </nav>
  <main id="main"></main>
</div>

<div id="lightbox" role="dialog" aria-label="Xem ảnh lớn"><img alt=""></div>
<div id="toast" role="status"></div>
<input type="file" id="imgInput" accept="image/*" multiple hidden>

<script>
(function(){
  var KEY = "lop-hoc-data-v1";
  var state = load() || sample();
  var editing = false;
  var current = state.lessons[0] ? state.lessons[0].id : null;
  var uploadFor = null;

  function sample(){
    return {site:"Lớp học trực tuyến", lessons:[{
      id:uid(), title:"Bài 1: Chào mừng đến với lớp học",
      desc:"Đây là bài học mẫu. Bấm “Chế độ giáo viên” để đổi nội dung, dán link video Google Drive và thêm ảnh từ máy của bạn.",
      videos:[], images:[]}]};
  }
  function uid(){return "l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
  function load(){try{var r=localStorage.getItem(KEY);return r?JSON.parse(r):null}catch(e){return null}}
  function save(){
    try{localStorage.setItem(KEY,JSON.stringify(state));return true}
    catch(e){toast("Bộ nhớ trình duyệt đã đầy. Hãy xóa bớt ảnh hoặc bấm “Sao lưu” để lưu ra file.");return false}
  }
  function toast(msg){
    var t=document.getElementById("toast");t.textContent=msg;t.style.display="block";
    clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display="none"},4200);
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function lesson(){return state.lessons.find(function(l){return l.id===current})}

  // Chuyển link thành link nhúng
  function embedUrl(u){
    u=(u||"").trim();
    var m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||u.match(/drive\.google\.com\/(?:open|uc)\?(?:[^#]*&)?id=([\w-]+)/);
    if(m) return "https://drive.google.com/file/d/"+m[1]+"/preview";
    m=u.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{6,})/);
    if(m) return "https://www.youtube.com/embed/"+m[1];
    return null;
  }

  // Thu nhỏ ảnh để lưu được nhiều ảnh hơn
  function shrink(file){
    return new Promise(function(ok,fail){
      var r=new FileReader();
      r.onerror=fail;
      r.onload=function(){
        var img=new Image();
        img.onerror=fail;
        img.onload=function(){
          var max=1200,s=Math.min(1,max/Math.max(img.width,img.height));
          var c=document.createElement("canvas");
          c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
          var x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);
          x.drawImage(img,0,0,c.width,c.height);
          ok(c.toDataURL("image/jpeg",0.75));
        };
        img.src=r.result;
      };
      r.readAsDataURL(file);
    });
  }

  function renderBrand(){
    var b=document.getElementById("brand");
    if(editing){b.innerHTML='<input aria-label="Tên lớp học" value="'+esc(state.site)+'">';
      b.firstChild.addEventListener("input",function(e){state.site=e.target.value;document.title=state.site||"Lớp học";save()});
    } else b.textContent=state.site;
    document.title=state.site||"Lớp học";
  }

  function renderList(){
    var ul=document.getElementById("list");
    ul.innerHTML=state.lessons.map(function(l,i){
      return '<li><button data-id="'+l.id+'"'+(l.id===current?' aria-current="true"':'')+'><span class="n">'+(i+1)+'.</span><span>'+esc(l.title||"Bài chưa đặt tên")+'</span></button></li>';
    }).join("");
    ul.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click",function(){current=b.dataset.id;render()});
    });
  }

  function renderMain(){
    var m=document.getElementById("main"),l=lesson();
    if(!l){m.innerHTML='<p class="empty">Chưa có bài học nào. Bấm “Chế độ giáo viên”, rồi “Thêm bài học”.</p>';return}
    var h="";
    if(editing){
      h+='<input class="field title-field" id="fTitle" aria-label="Tiêu đề bài học" value="'+esc(l.title)+'">';
      h+='<textarea class="field" id="fDesc" rows="5" aria-label="Nội dung bài học" style="margin:12px 0 28px">'+esc(l.desc)+'</textarea>';
    } else {
      h+='<h1>'+esc(l.title)+'</h1><p class="desc">'+esc(l.desc)+'</p>';
    }

    h+='<h3>Video bài giảng</h3>';
    if(!l.videos.length) h+='<p class="empty">'+(editing?'Chưa có video. Dán link Google Drive vào ô bên dưới.':'Bài này chưa có video.')+'</p>';
    l.videos.forEach(function(v,i){
      var e=embedUrl(v);
      h+='<div class="video"><div class="frame">'+(e?'<iframe src="'+esc(e)+'" allow="autoplay; fullscreen" allowfullscreen title="Video '+(i+1)+'"></iframe>':'')+'</div>';
      if(editing) h+='<div class="row"><button class="btn danger small" data-delvid="'+i+'">Xóa video</button></div>';
      h+='</div>';
    });
    if(editing){
      h+='<div class="adder"><input class="field" id="vidUrl" placeholder="Dán link video Google Drive (hoặc YouTube)" aria-label="Link video"><button class="btn" id="addVid">Thêm video</button></div>';
      h+='<p class="hint">Trên Google Drive: bấm chuột phải vào video, chọn Chia sẻ, đặt quyền “Bất kỳ ai có đường liên kết”, rồi sao chép liên kết. Nếu không đặt quyền này, học sinh sẽ không xem được.</p>';
    }

    h+='<h3>Hình ảnh</h3>';
    if(!l.images.length) h+='<p class="empty">'+(editing?'Chưa có ảnh. Bấm “Thêm ảnh từ máy”.':'Bài này chưa có hình ảnh.')+'</p>';
    else{
      h+='<div class="gallery">'+l.images.map(function(src,i){
        return '<figure><img src="'+src+'" alt="Hình minh họa '+(i+1)+'" data-zoom="'+i+'">'+(editing?'<button class="btn danger small x" style="background:var(--card)" data-delimg="'+i+'">Xóa</button>':'')+'</figure>';
      }).join("")+'</div>';
    }
    if(editing) h+='<div class="adder"><button class="btn" id="addImg">Thêm ảnh từ máy</button></div>';

    if(editing) h+='<div style="margin-top:40px"><button class="btn danger" id="delLesson">Xóa bài học này</button></div>';
    m.innerHTML=h;

    if(editing){
      m.querySelector("#fTitle").addEventListener("input",function(e){l.title=e.target.value;save();renderList()});
      m.querySelector("#fDesc").addEventListener("input",function(e){l.desc=e.target.value;save()});
      m.querySelector("#addVid").addEventListener("click",addVideo);
      m.querySelector("#vidUrl").addEventListener("keydown",function(e){if(e.key==="Enter")addVideo()});
      m.querySelector("#addImg").addEventListener("click",function(){document.getElementById("imgInput").click()});
      m.querySelector("#delLesson").addEventListener("click",function(){
        if(!confirm("Xóa bài học này cùng toàn bộ video và ảnh?"))return;
        state.lessons=state.lessons.filter(function(x){return x.id!==l.id});
        current=state.lessons[0]?state.lessons[0].id:null;save();render();
      });
      m.querySelectorAll("[data-delvid]").forEach(function(b){b.addEventListener("click",function(){l.videos.splice(+b.dataset.delvid,1);save();renderMain()})});
      m.querySelectorAll("[data-delimg]").forEach(function(b){b.addEventListener("click",function(){l.images.splice(+b.dataset.delimg,1);save();renderMain()})});
    }
    m.querySelectorAll("[data-zoom]").forEach(function(im){
      im.addEventListener("click",function(){
        var lb=document.getElementById("lightbox");lb.querySelector("img").src=im.src;lb.classList.add("on");
      });
    });
  }

  function addVideo(){
    var inp=document.getElementById("vidUrl"),u=inp.value.trim();
    if(!u)return;
    if(!embedUrl(u)){toast("Link chưa đúng. Hãy dán link dạng drive.google.com/file/d/... hoặc link YouTube.");return}
    lesson().videos.push(u);save();renderMain();
  }

  function render(){
    document.body.classList.toggle("edit",editing);
    var t=document.getElementById("toggle");
    t.textContent=editing?"Xong, xem như học sinh":"Chế độ giáo viên";
    t.setAttribute("aria-pressed",editing);
    renderBrand();renderList();renderMain();
  }

  document.getElementById("toggle").addEventListener("click",function(){editing=!editing;render()});
  document.getElementById("addLesson").addEventListener("click",function(){
    var l={id:uid(),title:"Bài "+(state.lessons.length+1)+": Tên bài học",desc:"",videos:[],images:[]};
    state.lessons.push(l);current=l.id;save();render();
  });
  document.getElementById("imgInput").addEventListener("change",function(e){
    var files=Array.prototype.slice.call(e.target.files),l=lesson();
    e.target.value="";
    if(!files.length||!l)return;
    Promise.all(files.map(shrink)).then(function(arr){
      l.images=l.images.concat(arr);
      if(save()) renderMain(); else {l.images=l.images.slice(0,l.images.length-arr.length);}
    }).catch(function(){toast("Không đọc được ảnh. Hãy thử file JPG hoặc PNG.")});
  });
  document.getElementById("lightbox").addEventListener("click",function(){this.classList.remove("on")});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")document.getElementById("lightbox").classList.remove("on")});

  // Sao lưu / khôi phục
  document.getElementById("export").addEventListener("click",function(){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:"application/json"}));
    a.download="lop-hoc-sao-luu.json";document.body.appendChild(a);a.click();a.remove();
  });
  document.getElementById("import").addEventListener("click",function(){document.getElementById("importFile").click()});
  document.getElementById("importFile").addEventListener("change",function(e){
    var f=e.target.files[0];e.target.value="";if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(!d||!Array.isArray(d.lessons))throw 0;
        if(!confirm("Khôi phục sẽ thay thế nội dung hiện tại. Tiếp tục?"))return;
        state=d;current=state.lessons[0]?state.lessons[0].id:null;save();render();toast("Đã khôi phục.");
      }catch(err){toast("File sao lưu không hợp lệ.")}
    };
    r.readAsText(f);
  });

  render();
})();
</script>
</body>
</html>
